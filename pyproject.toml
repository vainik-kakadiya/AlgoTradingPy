[project]
name = "algotrading-py"
version = "1.0.0"
description = "Algo Trading Lab backend: strategy engine, backtesting and paper trading (paper-only, no real orders)."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "pandas==2.2.3",
    "numpy==2.2.1",
    "kiteconnect==5.0.1",
    "python-multipart==0.0.20",
    "tzdata==2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
